name: Build Genesis ROM

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install asm68k
        run: sudo npm install -g asm68k

      - name: Assemble Genesis ROM
        run: asm68k game.asm game.bin

      - name: Upload Genesis ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-rom
          path: game.bin
