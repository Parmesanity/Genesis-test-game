name: Build Genesis ROM

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install M68K GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu

      - name: Assemble ROM
        run: |
          m68k-linux-gnu-gcc -c game.asm -o game.o
          m68k-linux-gnu-objcopy -O binary game.o game.bin

      - name: Upload Genesis ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-rom
          path: game.bin
