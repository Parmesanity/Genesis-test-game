name: Build Genesis ROM

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ROM using SGDK Docker Container
        run: |
          docker run --rm -v ${{ github.workspace }}:/m68k ghcr.io/stephane-d/sgdk:latest /bin/bash -c "m68k-elf-gcc -c -m68000 game.asm -o game.o && m68k-elf-objcopy -O binary game.o game.bin"

      - name: Upload Genesis ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-rom
          path: game.bin
