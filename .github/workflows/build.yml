name: Build Genesis ROM

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up VASM Assembler
        run: |
          curl -sL https://github.com/prebuilt-amiga-dev-tools/vasmm68k-build/releases/latest/download/vasmm68k_mot_linux-x86_64.tar.gz | tar -xz
          sudo mv vasmm68k_mot /usr/local/bin/
          sudo chmod +x /usr/local/bin/vasmm68k_mot

      - name: Assemble Genesis ROM
        run: |
          vasmm68k_mot -Fbin -nosym -o game.bin game.asm

      - name: Upload Genesis ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-rom
          path: game.bin
