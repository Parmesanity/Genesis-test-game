name: Build Genesis ROM

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build VASM Assembler
        run: |
          git clone https://github.com/mbitsnbites/vasm-mirror.git vasm
          cd vasm
          make CPU=m68k SYNTAX=mot
          sudo cp vasmm68k_mot /usr/local/bin/

      - name: Assemble Genesis ROM
        run: |
          vasmm68k_mot -Fbin -nosym -o game.bin game.asm

      - name: Upload Genesis ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-rom
          path: game.bin
